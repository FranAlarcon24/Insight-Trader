<title>Insight Trader Terminal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#16211E;
  --paper:#F4F1E8;
  --surface:#FFFFFF;
  --surface-2:#EAE6D8;
  --accent:#B8722E;
  --accent-soft:#EADFC9;
  --good:#3E7C59;
  --good-soft:#DCEAE0;
  --warn:#B2432E;
  --warn-soft:#F3DCD5;
  --line:#D9D3C0;
  --muted:#5C6660;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EDE8DA;
    --paper:#12181A;
    --surface:#182022;
    --surface-2:#1E2729;
    --accent:#E3A15C;
    --accent-soft:#3A2E1C;
    --good:#6FC08F;
    --good-soft:#1E2E24;
    --warn:#E28268;
    --warn-soft:#332019;
    --line:#2B3436;
    --muted:#93A29B;
  }
}
:root[data-theme="dark"]{
  --ink:#EDE8DA;
  --paper:#12181A;
  --surface:#182022;
  --surface-2:#1E2729;
  --accent:#E3A15C;
  --accent-soft:#3A2E1C;
  --good:#6FC08F;
  --good-soft:#1E2E24;
  --warn:#E28268;
  --warn-soft:#332019;
  --line:#2B3436;
  --muted:#93A29B;
}

*{box-sizing:border-box;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans', -apple-system, Segoe UI, sans-serif;
  padding:20px 20px 48px;
  min-height:100%;
}
.mono{font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;}
h1,h2,h3{text-wrap:balance; margin:0;}

.wrap{max-width:1080px; margin:0 auto; display:flex; flex-direction:column; gap:20px;}

header.app{
  display:flex; align-items:baseline; justify-content:space-between; gap:16px; flex-wrap:wrap;
  border-bottom:1px solid var(--line); padding-bottom:16px;
}
.brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
.brand .mark{
  font-family:'IBM Plex Mono'; font-weight:600; font-size:13px; letter-spacing:.08em;
  color:var(--accent); border:1px solid var(--accent); border-radius:4px; padding:2px 6px;
}
header.app h1{font-size:22px; font-weight:600;}
header.app .sub{color:var(--muted); font-size:13.5px; max-width:38ch;}

.demo-banner{
  display:flex; gap:10px; align-items:flex-start;
  background:var(--surface-2); border:1px dashed var(--line); border-radius:8px;
  padding:10px 14px; font-size:13px; color:var(--muted); line-height:1.5;
}
.demo-banner strong{color:var(--ink); font-weight:600;}

.layout{display:grid; grid-template-columns:230px 1fr; gap:18px; align-items:start;}
@media (max-width:720px){ .layout{grid-template-columns:1fr;} }

.sidebar{
  display:flex; flex-direction:column; gap:8px;
  position:sticky; top:20px;
}
.sidebar .label{
  font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); padding:0 2px 2px;
}
@media (max-width:720px){ .sidebar{position:static; flex-direction:row; flex-wrap:wrap;} }

.holding{
  display:flex; flex-direction:column; gap:4px; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:10px 12px; cursor:pointer; font:inherit; color:inherit;
  transition:border-color .15s ease, background .15s ease;
  flex:1 1 140px;
}
.holding:hover{border-color:var(--accent);}
.holding:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.holding.active{background:var(--accent-soft); border-color:var(--accent);}
.holding .row1{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
.holding .ticker{font-family:'IBM Plex Mono'; font-weight:600; font-size:15px; letter-spacing:.02em;}
.holding .weight{font-family:'IBM Plex Mono'; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;}
.holding .name{font-size:12px; color:var(--muted);}
.holding .cls{
  align-self:flex-start; font-size:10.5px; font-family:'IBM Plex Mono'; letter-spacing:.04em;
  color:var(--muted); border:1px solid var(--line); border-radius:20px; padding:1px 7px; margin-top:2px;
}

.panel{display:flex; flex-direction:column; gap:16px; min-width:0;}

.question-card{
  background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px;
  display:flex; flex-direction:column; gap:6px;
}
.question-card .eyebrow{font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);}
.question-card .q{font-size:16px; font-weight:500;}

.signal-strip{
  display:flex; flex-wrap:wrap; gap:8px;
}
.pill{
  display:flex; align-items:baseline; gap:5px;
  background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:6px 10px; font-size:12.5px;
}
.pill .k{color:var(--muted); font-size:10.5px; font-family:'IBM Plex Mono'; letter-spacing:.04em; text-transform:uppercase;}
.pill .v{font-family:'IBM Plex Mono'; font-weight:600; font-variant-numeric:tabular-nums;}
.pill.good{background:var(--good-soft); border-color:var(--good); }
.pill.good .v{color:var(--good);}
.pill.warn{background:var(--warn-soft); border-color:var(--warn); }
.pill.warn .v{color:var(--warn);}

.sources{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:640px){ .sources{grid-template-columns:1fr;} }

.source-col{
  background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px;
  display:flex; flex-direction:column; gap:10px; min-width:0;
}
.source-col h3{
  font-size:11.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600;
  display:flex; align-items:center; gap:7px;
}
.source-col h3 .dot{width:7px; height:7px; border-radius:50%; display:inline-block;}
.source-col.internal h3 .dot{background:var(--accent);}
.source-col.external h3 .dot{background:var(--good);}
.chunk{
  font-size:12.5px; line-height:1.55; color:var(--ink); padding:9px 10px;
  background:var(--surface-2); border-radius:8px; border-left:3px solid var(--line);
}
.source-col.internal .chunk{border-left-color:var(--accent);}
.source-col.external .chunk{border-left-color:var(--good);}
.chunk .num{font-family:'IBM Plex Mono'; font-weight:600; color:var(--ink);}

.reco{
  border-radius:12px; padding:18px 20px; display:flex; flex-direction:column; gap:10px;
  border:1px solid; position:relative;
}
.reco.action-reduce{background:var(--warn-soft); border-color:var(--warn);}
.reco.action-hold{background:var(--good-soft); border-color:var(--good);}
.reco .top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.reco .eyebrow{font-family:'IBM Plex Mono'; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);}
.reco .action{
  font-family:'IBM Plex Mono'; font-weight:700; font-size:14px; letter-spacing:.03em; text-transform:uppercase;
  padding:3px 10px; border-radius:20px;
}
.reco.action-reduce .action{background:var(--warn); color:#fff;}
.reco.action-hold .action{background:var(--good); color:#fff;}
.reco .body{font-size:14.5px; line-height:1.6;}
.reco .body b{font-family:'IBM Plex Mono'; font-weight:600;}

footer.app{
  border-top:1px solid var(--line); padding-top:14px; font-size:12px; color:var(--muted);
  display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
}
footer.app a{color:var(--accent);}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const h = React.createElement;

const HOLDINGS_META = {
  AAPL: { name: "Apple Inc.", weight: 22.5, cls: "equity_tech" },
  TSLA: { name: "Tesla Inc.", weight: 18.0, cls: "equity_tech" },
  BND:  { name: "Vanguard Total Bond Market ETF", weight: 30.0, cls: "fixed_income" },
  ETH:  { name: "Ethereum", weight: 15.0, cls: "crypto" },
  VNQ:  { name: "Vanguard Real Estate ETF", weight: 14.5, cls: "real_estate" },
};

const RESPONSES = [{"ticker": "TSLA", "question": "Deberia mantener, comprar o vender mi posicion?", "internal": ["Transaccion historica: el 2026-08-02 el cliente realizo buy de 5 unidades de TSLA a precio 205.1.", "Perfil de riesgo del cliente Constanza Fuentes: categoria moderado, tolerancia_drawdown_pct: 12, horizonte de inversion 5 anios. Cliente declara tolerancia moderada al riesgo; prioriza preservacion de capital sobre retorno agresivo.", "Posicion del cliente en TSLA (Tesla Inc.): 15 unidades, precio promedio de compra 210.5, peso actual en portafolio 18.0%, clase de activo equity_tech."], "external": ["Datos de mercado en tiempo real (simulated_chainlink_price_feeds) para TSLA: precio 236.7, cambio_7d_pct: 12.4, volatilidad_7d_pct: 21.8, tendencia alza_fuerte.", "Noticia sobre TSLA (2026-09-08): Tesla supera estimados de entregas trimestrales y anuncia expansion en Latinoamerica. sentimiento: positivo. La compania reporto un aumento de entregas del 18% interanual, impulsando el precio de la accion. Analistas destacan riesgo de sobrevaloracion de corto plazo."], "recommendation": "Recomendacion para TSLA: reducir posicion.\nJustificacion: Se sugiere reducir posicion porque la volatilidad reciente (21.8%) supera la tolerancia al riesgo declarada por el cliente (12.0%). Esta recomendacion se basa en datos de mercado y perfil de riesgo recuperados por el sistema, citados explicitamente arriba.", "signal": {"risk_category": "moderado", "risk_tolerance": 12, "volatility": 21.8, "change": 12.4, "trend": "alza_fuerte", "sentiment": "positivo", "exceeds": true}}, {"ticker": "AAPL", "question": "Deberia mantener, comprar o vender mi posicion?", "internal": ["Transaccion historica: el 2026-08-28 el cliente realizo sell de 10 unidades de AAPL a precio 172.4.", "Perfil de riesgo del cliente Constanza Fuentes: categoria moderado, tolerancia_drawdown_pct: 12, horizonte de inversion 5 anios. Cliente declara tolerancia moderada al riesgo; prioriza preservacion de capital sobre retorno agresivo.", "Posicion del cliente en AAPL (Apple Inc.): 40 unidades, precio promedio de compra 168.2, peso actual en portafolio 22.5%, clase de activo equity_tech."], "external": ["Noticia sobre AAPL (2026-09-06): Apple presenta nueva linea de productos con foco en IA generativa. sentimiento: positivo. El mercado reacciono favorablemente ante el anuncio, con expectativas de crecimiento en el segmento de servicios.", "Datos de mercado en tiempo real (simulated_chainlink_price_feeds) para AAPL: precio 178.9, cambio_7d_pct: 3.1, volatilidad_7d_pct: 9.4, tendencia alza."], "recommendation": "Recomendacion para AAPL: mantener posicion.\nJustificacion: Se sugiere mantener posicion porque no se detectan senales que justifiquen un cambio respecto al perfil de riesgo del cliente. Esta recomendacion se basa en datos de mercado y perfil de riesgo recuperados por el sistema, citados explicitamente arriba.", "signal": {"risk_category": "moderado", "risk_tolerance": 12, "volatility": 9.4, "change": 3.1, "trend": "alza", "sentiment": "positivo", "exceeds": false}}, {"ticker": "ETH", "question": "Deberia mantener, comprar o vender mi posicion?", "internal": ["Transaccion historica: el 2026-08-15 el cliente realizo buy de 1.0 unidades de ETH a precio 2050.0.", "Perfil de riesgo del cliente Constanza Fuentes: categoria moderado, tolerancia_drawdown_pct: 12, horizonte de inversion 5 anios. Cliente declara tolerancia moderada al riesgo; prioriza preservacion de capital sobre retorno agresivo.", "Posicion del cliente en ETH (Ethereum): 3.2 unidades, precio promedio de compra 2100.0, peso actual en portafolio 15.0%, clase de activo crypto."], "external": ["Noticia sobre ETH (2026-09-09): Actualizacion de red Ethereum reduce comisiones y mejora escalabilidad. sentimiento: positivo. El upgrade genero un rally de precio, pero persiste alta volatilidad en el corto plazo debido a la naturaleza especulativa del activo.", "Datos de mercado en tiempo real (simulated_chainlink_price_feeds) para ETH: precio 2352.1, cambio_7d_pct: 11.9, volatilidad_7d_pct: 24.6, tendencia alza_fuerte."], "recommendation": "Recomendacion para ETH: reducir posicion.\nJustificacion: Se sugiere reducir posicion porque la volatilidad reciente (24.6%) supera la tolerancia al riesgo declarada por el cliente (12.0%). Esta recomendacion se basa en datos de mercado y perfil de riesgo recuperados por el sistema, citados explicitamente arriba.", "signal": {"risk_category": "moderado", "risk_tolerance": 12, "volatility": 24.6, "change": 11.9, "trend": "alza_fuerte", "sentiment": "positivo", "exceeds": true}}, {"ticker": "BND", "question": "Deberia mantener, comprar o vender mi posicion?", "internal": ["Perfil de riesgo del cliente Constanza Fuentes: categoria moderado, tolerancia_drawdown_pct: 12, horizonte de inversion 5 anios. Cliente declara tolerancia moderada al riesgo; prioriza preservacion de capital sobre retorno agresivo.", "Transaccion historica: el 2026-09-01 el cliente realizo buy de 20 unidades de BND a precio 71.8.", "Posicion del cliente en BND (Vanguard Total Bond Market ETF): 120 unidades, precio promedio de compra 72.1, peso actual en portafolio 30.0%, clase de activo fixed_income."], "external": ["Noticia sobre BND (2026-09-05): Banco central mantiene tasas sin cambios, renta fija se mantiene estable. sentimiento: neutral. La decision de politica monetaria no genero sorpresas; los instrumentos de renta fija se mantienen como refugio de estabilidad.", "Datos de mercado en tiempo real (simulated_chainlink_price_feeds) para BND: precio 71.2, cambio_7d_pct: -0.4, volatilidad_7d_pct: 1.2, tendencia estable."], "recommendation": "Recomendacion para BND: mantener posicion.\nJustificacion: Se sugiere mantener posicion porque no se detectan senales que justifiquen un cambio respecto al perfil de riesgo del cliente. Esta recomendacion se basa en datos de mercado y perfil de riesgo recuperados por el sistema, citados explicitamente arriba.", "signal": {"risk_category": "moderado", "risk_tolerance": 12, "volatility": 1.2, "change": -0.4, "trend": "estable", "sentiment": "neutral", "exceeds": false}}, {"ticker": "VNQ", "question": "Deberia mantener, comprar o vender mi posicion?", "internal": ["Posicion del cliente en VNQ (Vanguard Real Estate ETF): 50 unidades, precio promedio de compra 85.3, peso actual en portafolio 14.5%, clase de activo real_estate.", "Perfil de riesgo del cliente Constanza Fuentes: categoria moderado, tolerancia_drawdown_pct: 12, horizonte de inversion 5 anios. Cliente declara tolerancia moderada al riesgo; prioriza preservacion de capital sobre retorno agresivo.", "Transaccion historica: el 2026-09-05 el cliente realizo buy de 10 unidades de VNQ a precio 86.0."], "external": ["Noticia sobre VNQ (2026-09-07): Tasas de interes elevadas siguen presionando al sector inmobiliario. sentimiento: negativo. El sector REIT continua bajo presion por el entorno de tasas altas, con caidas sostenidas en las ultimas semanas.", "Datos de mercado en tiempo real (simulated_chainlink_price_feeds) para VNQ: precio 83.1, cambio_7d_pct: -2.6, volatilidad_7d_pct: 6.7, tendencia baja."], "recommendation": "Recomendacion para VNQ: mantener posicion y monitorear.\nJustificacion: Se sugiere mantener posicion y monitorear porque el activo presenta una caida reciente (-2.6% en 7 dias) que amerita seguimiento. Esta recomendacion se basa en datos de mercado y perfil de riesgo recuperados por el sistema, citados explicitamente arriba.", "signal": {"risk_category": "moderado", "risk_tolerance": 12, "volatility": 6.7, "change": -2.6, "trend": "baja", "sentiment": "negativo", "exceeds": false}}];

function actionFromRecommendation(text) {
  const t = text.toLowerCase();
  if (t.includes("reducir")) return "reduce";
  return "hold";
}

function highlightNumbers(text) {
  const parts = text.split(/(\(-?\d+(?:\.\d+)?%\)|-?\d+(?:\.\d+)?%)/g);
  return parts.map((part, i) =>
    /%\)?$/.test(part) ? h("b", { key: i }, part) : part
  );
}

function Pill({ k, v, tone }) {
  return h("div", { className: "pill" + (tone ? " " + tone : "") },
    h("span", { className: "k" }, k),
    h("span", { className: "v" }, v)
  );
}

function highlightChunk(text) {
  const parts = text.split(/(-?\d+(?:\.\d+)?%?)/g);
  return parts.map((part, i) =>
    /^-?\d/.test(part) ? h("span", { className: "num", key: i }, part) : part
  );
}

function SourceColumn({ title, chunks, variant }) {
  return h("div", { className: "source-col " + variant },
    h("h3", null, h("span", { className: "dot" }), title),
    chunks.map((c, i) => h("div", { className: "chunk", key: i }, highlightChunk(c)))
  );
}

function Sidebar({ tickers, active, onSelect }) {
  return h("div", { className: "sidebar" },
    h("div", { className: "label" }, "Portafolio del cliente"),
    tickers.map((t) => {
      const meta = HOLDINGS_META[t];
      return h("button", {
        key: t,
        className: "holding" + (t === active ? " active" : ""),
        onClick: () => onSelect(t),
      },
        h("div", { className: "row1" },
          h("span", { className: "ticker" }, t),
          h("span", { className: "weight" }, meta.weight.toFixed(1) + "%")
        ),
        h("span", { className: "name" }, meta.name),
        h("span", { className: "cls" }, meta.cls)
      );
    })
  );
}

function Detail({ data }) {
  const action = actionFromRecommendation(data.recommendation);
  const [headline, ...rest] = data.recommendation.split("\n");
  const justification = rest.join(" ");
  const s = data.signal;

  return h("div", { className: "panel" },
    h("div", { className: "question-card" },
      h("span", { className: "eyebrow" }, "Pregunta del cliente · " + data.ticker),
      h("span", { className: "q" }, "“" + data.question + "”")
    ),
    h("div", { className: "signal-strip" },
      h(Pill, { k: "Perfil", v: s.risk_category }),
      h(Pill, { k: "Tolerancia drawdown", v: s.risk_tolerance.toFixed(1) + "%" }),
      h(Pill, { k: "Volatilidad 7d", v: s.volatility.toFixed(1) + "%", tone: s.exceeds ? "warn" : "good" }),
      h(Pill, { k: "Cambio 7d", v: (s.change > 0 ? "+" : "") + s.change.toFixed(1) + "%" }),
      h(Pill, { k: "Tendencia", v: s.trend.replace("_", " ") }),
      h(Pill, { k: "Sentimiento noticias", v: s.sentiment })
    ),
    h("div", { className: "sources" },
      h(SourceColumn, { title: "Fuentes internas", chunks: data.internal, variant: "internal" }),
      h(SourceColumn, { title: "Fuentes externas", chunks: data.external, variant: "external" })
    ),
    h("div", { className: "reco action-" + action },
      h("div", { className: "top" },
        h("span", { className: "eyebrow" }, "Recomendación del copiloto"),
        h("span", { className: "action" }, action === "reduce" ? "Reducir posición" : headline.split(": ")[1] || "Mantener")
      ),
      h("div", { className: "body" }, highlightNumbers(justification.replace(/^Justificacion:\s*/, "")))
    )
  );
}

function App() {
  const tickers = RESPONSES.map((r) => r.ticker);
  const [active, setActive] = React.useState(tickers[0]);
  const data = RESPONSES.find((r) => r.ticker === active);

  return h("div", { className: "wrap" },
    h("header", { className: "app" },
      h("div", null,
        h("div", { className: "brand" },
          h("span", { className: "mark" }, "IT"),
          h("h1", null, "Insight Trader")
        ),
        h("div", { className: "sub" }, "Copiloto de trading explicable — recomendaciones con fuentes citadas")
      )
    ),
    h("div", { className: "demo-banner" },
      h("span", null,
        h("strong", null, "Demo estática: "),
        "estas son respuestas reales generadas por el pipeline de agentes (RAG dual + MockLLM), capturadas para esta vista. La app Python completa corre por terminal con ",
        h("code", { className: "mono" }, "python -m insight_trader.main <TICKER>"),
        "."
      )
    ),
    h("div", { className: "layout" },
      h(Sidebar, { tickers, active, onSelect: setActive }),
      data ? h(Detail, { data }) : null
    ),
    h("footer", { className: "app" },
      h("span", null, "Cliente: Constanza Fuentes · Perfil de riesgo moderado · Horizonte 5 años"),
      h("span", null, "Insight Trader · Evaluación ISY0101")
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
